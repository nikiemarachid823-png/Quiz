        //affichage des questions
        function affichagesQuestion(Tex){

}*/

        affichagesQuestion(index)
       Verification();
    //Alterne les Questions
  
    Suite.addEventListener('click',function Change(){

 { Info.innerHTML="Bien joué ✅👍😂";Score.value++;}
